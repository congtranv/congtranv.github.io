<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Văn Cộng - Portfolio</title>
    <style>
        :root {
            --bg-start: #064e3b; --bg-end: #065f46;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color: white;
        }
        body.material-you {
            --bg-start: #4c0303; --bg-end: #7b0d0d;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            --text-color: #fce4e4;
        }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, var(--bg-start), var(--bg-end)); font-family: 'Segoe UI', sans-serif; color: var(--text-color); transition: all 0.5s ease; }
        
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 30px; padding: 50px; box-shadow: var(--glass-shadow); text-align: center; width: 90%; max-width: 400px; border-top: 1px solid rgba(255,255,255,0.4); border-left: 1px solid rgba(255,255,255,0.4); }
        
        .nav-menu { position: absolute; top: 20px; display: flex; gap: 10px; }
        .nav-menu button { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(10px); }
        
        #theme-toggle { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-color); cursor: pointer; backdrop-filter: blur(10px); }
        
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="nav-menu">
        <button onclick="showPage('home')">Trang chủ</button>
        <button onclick="showPage('blog')">Blog</button>
        <button onclick="showPage('projects')">Dự án</button>
        <button onclick="showPage('about')">About</button>
    </div>

    <div id="home" class="page active glass-card">
        <h1>Trần Văn Cộng</h1>
        <p>Kỹ sư phát triển phần mềm</p>
    </div>
    <div id="blog" class="page glass-card"><h1>Blog</h1><p>Coming soon...</p></div>
    <div id="projects" class="page glass-card"><h1>Dự án</h1><p>Coming soon...</p></div>
    <div id="about" class="page glass-card"><h1>About</h1><p>Software Engineer.</p></div>

    <button id="theme-toggle">Chuyển Giao Diện</button>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('material-you');
        });
    </script>
</body>
</html>
