name: Sync GitHub Issues to Posts

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync issues to data/posts.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/sync-issues.mjs

      - name: Sync posts to Firebase
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          curl -fsS -X PUT -H "Content-Type: application/json" \
            -d @data/posts.json \
            "https://congtranv-blog-default-rtdb.asia-southeast1.firebasedatabase.app/posts.json?auth=${FIREBASE_DB_SECRET}"

      - name: Comment and close issue
        if: github.event.issue.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            const isPostIssue = labels.some(l => ['blog', 'project', 'projects', 'about'].includes(l));
            if (!isPostIssue) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'đã update'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
