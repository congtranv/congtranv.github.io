name: Auto Translate Posts

on:
  push:
    branches: [main, master]
    paths:
      - 'data/posts.json'

permissions:
  contents: write

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate missing English posts
        run: node .github/scripts/translate-posts.mjs

      - name: Commit translated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --staged --quiet || git commit -m "chore: auto-translate posts to English [skip ci]"
          git push
